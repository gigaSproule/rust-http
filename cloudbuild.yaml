steps:
  - name: 'gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/rust-http', '.' ]
  - name: 'gcr.io/cloud-builders/docker@sha256:2e8d40d8e48dc14fab4213d5e532d74f63fd403d9e8d7f6463096a75820286c3'
    args: [ 'push', 'gcr.io/$PROJECT_ID/rust-http' ]
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:35ae671900df3e48a82334cb9ded2a06f555c2193a0e57f2f56dfa626e2cfb8e'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rust-http'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rust-http'
      - '--port'
      - '8000'
      - '--region'
      - 'us-east1'
      - '--platform'
      - 'managed'
      - '--cpu'
      - '1'
      - '--memory'
      - '128Mi'
      - '--allow-unauthenticated'
images:
  - 'gcr.io/$PROJECT_ID/rust-http'
